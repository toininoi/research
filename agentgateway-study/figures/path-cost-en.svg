<text x="822.0" y="378" font-size="9.5" fill="#999" text-anchor="middle">8</text>
<text x="702.0" y="394" font-size="10" fill="#777" text-anchor="middle">p50 (ms)</text>
<text x="486" y="154" font-size="11" fill="#333">new conn per call</text>
<text x="486" y="168" font-size="10" fill="#888">100 rps</text>
<line x1="780.0" y1="152" x2="801.0" y2="152" stroke="#6a4b9e" stroke-width="4" opacity="0.45"/>
<circle cx="780.0" cy="152" r="5.5" fill="#8a8f98"/>
<circle cx="801.0" cy="152" r="5.5" fill="#6a4b9e"/>
<text x="780.0" y="173" font-size="9.5" fill="#777" text-anchor="middle">6.6</text>
<text x="801.0" y="141" font-size="9.5" fill="#6a4b9e" text-anchor="middle" font-weight="bold">7.3</text>
<text x="878" y="157" font-size="12.5" fill="#222" text-anchor="end" font-weight="bold">+0.7ms</text>
<text x="486" y="212" font-size="11" fill="#333">new conn per call</text>
<text x="486" y="226" font-size="10" fill="#888">200 rps</text>
<line x1="762.0" y1="210" x2="777.0" y2="210" stroke="#6a4b9e" stroke-width="4" opacity="0.45"/>
<circle cx="762.0" cy="210" r="5.5" fill="#8a8f98"/>
<circle cx="777.0" cy="210" r="5.5" fill="#6a4b9e"/>
<text x="762.0" y="231" font-size="9.5" fill="#777" text-anchor="middle">6.0</text>
<text x="777.0" y="199" font-size="9.5" fill="#6a4b9e" text-anchor="middle" font-weight="bold">6.5</text>
<text x="878" y="215" font-size="12.5" fill="#222" text-anchor="end" font-weight="bold">+0.5ms</text>
<text x="486" y="270" font-size="11" fill="#333">connection reuse</text>
<text x="486" y="284" font-size="10" fill="#888">100 rps</text>
<line x1="732.0" y1="268" x2="750.0" y2="268" stroke="#6a4b9e" stroke-width="4" opacity="0.45"/>
<circle cx="732.0" cy="268" r="5.5" fill="#8a8f98"/>
