<text x="460.0" y="30" font-size="14.5" fill="#111" text-anchor="middle" font-weight="bold">무엇을 더하면 지연이 얼마나 느는가 (p50 중앙값의 차이, 각 5회)</text>
<text x="460.0" y="50" font-size="11" fill="#777" text-anchor="middle">각 행 = 같은 날 잰 통제 쌍. 점 = 실측 p50 절대값, 오른쪽 = 중앙값 차이(본문 표의 증분은 짝 평균). 절대값 비교는 행 안에서만(측정일 상이). p99는 본문 표.</text>
